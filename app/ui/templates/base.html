<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0c11" />
  <title>{% block title %}Inference Hub{% endblock %} · Inference Hub</title>
  <script>
    /* FOUC onleme: tema tercihini stylesheet'ten once uygula */
    (function () {
      try {
        var pref = localStorage.getItem("hub_theme") || "auto";
        var dark = pref === "dark" ||
          (pref === "auto" && window.matchMedia &&
           window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.setAttribute("data-theme-pref", pref);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css?v={{ app_version }}" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236e9bff'/%3E%3Crect x='8' y='8' width='16' height='16' rx='3' fill='%230a0c11'/%3E%3C/svg%3E" />
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block shell %}
  <div class="app-shell">
    <aside class="sidebar" id="mainSidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div class="name">Inference Hub<span class="dim">v{{ app_version }}</span></div>
      </div>

      <div class="user-card" id="userCard"></div>

      <div class="nav-section">
        <div class="title" data-i18n>Calisma alani</div>
        <a href="/ui/chat"      data-nav="chat"      class="nav-item"><span class="icon">💬</span> <span data-i18n>Sohbet</span></a>
        <a href="/ui/dashboard" data-nav="dashboard" class="nav-item"><span class="icon">📊</span> <span data-i18n>Genel bakis</span></a>
        <a href="/ui/models"    data-nav="models"    class="nav-item"><span class="icon">🧩</span> <span data-i18n>Modeller</span></a>
      </div>

      <div class="nav-section" data-admin-only>
        <div class="title" data-i18n>Yonetim</div>
        <a href="/ui/admin"     data-nav="admin"     class="nav-item"><span class="icon">⚙</span> <span data-i18n>Ayarlar</span></a>
        <a href="/ui/resources" data-nav="resources" class="nav-item"><span class="icon">📈</span> <span data-i18n>Kaynaklar</span></a>
      </div>

      <div class="spacer"></div>

      <button class="theme-toggle" id="langToggle" type="button" aria-label="Dil degistir / Change language" title="Dil degistir / Change language">
        <span class="ico" aria-hidden="true">🌐</span>
        <span class="lbl">Dil: TR</span>
      </button>

      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Tema degistir" title="Tema degistir" data-i18n-attrs="aria-label,title">
        <span class="ico" aria-hidden="true"></span>
        <span class="lbl">Tema</span>
      </button>

      <div class="footer-mini">
        <a href="/docs" target="_blank" rel="noopener">API · OpenAPI</a>
        <a href="http://localhost:3000" target="_blank" rel="noopener" data-monitor-link="3000">Grafana</a>
        <a href="http://localhost:9090" target="_blank" rel="noopener" data-monitor-link="9090">Prometheus</a>
        <a href="/ui/privacy">KVKK</a>
      </div>
    </aside>

    <div class="main-area">
      <div class="mobile-topbar">
        <button class="hamburger" id="navToggle" type="button" aria-label="Menuyu ac/kapat" aria-expanded="false" aria-controls="mainSidebar">☰</button>
        <div class="mt-brand"><span class="mt-logo" aria-hidden="true"></span> Inference Hub</div>
      </div>
      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  {% endblock %}

  <div class="nav-backdrop" id="navBackdrop"></div>
  <div id="toast-area"></div>

  <script src="/static/i18n.js?v={{ app_version }}"></script>
  <script src="/static/bootstrap.js?v={{ app_version }}"></script>
  <script src="/static/common.js?v={{ app_version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
