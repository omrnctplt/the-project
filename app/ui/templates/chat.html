{% extends "base.html" %}
{% block title %}Sohbet{% endblock %}
{% block body_class %}page-chat{% endblock %}
{% block content %}
<div class="chat-layout">
  <aside class="chat-sidebar">
    <button class="new-chat-btn" id="newChatBtn">+ Yeni sohbet</button>
    <div class="muted" style="font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em; padding:0.5rem 0.25rem 0.1rem;">Gecmis</div>
    <ul class="conv-list" id="convList"></ul>
  </aside>
  <div class="chat-main">
    <div class="chat-header">
      <div class="title" id="chatTitle">Yeni sohbet</div>
      <div class="meta-controls">
        <label class="checkbox" style="margin:0; font-size:0.8rem;">
          <input type="checkbox" id="streamToggle" checked /> Streaming
        </label>
        <select id="adminModel" class="hidden"><option value="">(otomatik)</option></select>
      </div>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input-area">
      <form id="chatForm" class="input-wrap">
        <textarea id="prompt" rows="1" placeholder="Bir sey sorun... (Enter ile gonder, Shift+Enter yeni satir)"></textarea>
        <div class="controls">
          <span class="hint"><span class="kbd">Enter</span> gonder · <span class="kbd">Shift+Enter</span> yeni satir</span>
          <button type="submit" class="primary" id="sendBtn">Gonder ↵</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/chat.js"></script>
{% endblock %}
