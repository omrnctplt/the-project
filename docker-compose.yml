name: onprem-ai

x-common-env: &common-env
  TZ: ${TZ:-Europe/Istanbul}

services:
  gateway:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: onprem-ai-gateway:local
    container_name: onprem-ai-gateway
    restart: unless-stopped
    environment:
      <<: *common-env
      OLLAMA_HOST: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET zorunlu, .env dosyasini doldurun}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DATA_DIR: /data
      CONFIG_DIR: /etc/onprem-ai
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTO_PULL_MODELS: ${AUTO_PULL_MODELS:-true}
      IDLE_UNLOAD_MINUTES: ${IDLE_UNLOAD_MINUTES:-10}
    volumes:
      - ./data:/data
      - ./config:/etc/onprem-ai:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [onprem]

  ollama:
    image: ollama/ollama:latest
    container_name: onprem-ai-ollama
    restart: unless-stopped
    environment:
      <<: *common-env
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [onprem]

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: onprem-ai-prom
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "${PROM_PORT:-9090}:9090"
    depends_on:
      gateway:
        condition: service_started
    networks: [onprem]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: onprem-ai-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks: [onprem]

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    image: onprem-ai-simulator:local
    container_name: onprem-ai-sim
    profiles: ["sim"]
    environment:
      <<: *common-env
      GATEWAY_URL: http://gateway:8080
      SIM_USERS: ${SIM_USERS:-10}
      SIM_DURATION_SEC: ${SIM_DURATION_SEC:-120}
      SIM_DEPT_MIX: ${SIM_DEPT_MIX:-hr:0.3,engineering:0.5,general:0.2}
      SIM_THINK_TIME_SEC: ${SIM_THINK_TIME_SEC:-2}
    depends_on:
      gateway:
        condition: service_healthy
    networks: [onprem]

networks:
  onprem:
    driver: bridge

volumes:
  ollama_models:
  prom_data:
  grafana_data:
