# =============================================================
# On-Premise AI Gateway — Model Havuzu (Haziran 2026)
# =============================================================
# Donanima gore tier'lanmis guncel acik kaynak model havuzu.
#
#   tier   : edge (<=4 GB) | laptop (4-16 GB) | workstation (16-48 GB) | datacenter (48 GB+)
#   source : ollama | huggingface   (huggingface => ollama "hf.co/..." tag'i ile cekilir)
#   ram_gb / vram_gb : Q4_K_M kuantizasyon icin yaklasik bellek ihtiyaci
#
# Capacity planlayicisi bu havuzu donanim profiline gore otomatik
# aktif/pasif isaretler; admin "Modeller" sayfasindan tek tikla pull/sil yapar.

defaults:
  context_window: 4096
  temperature: 0.6

categories:
  text:
    description: "Genel metin, ozet, e-posta, sohbet"
  code:
    description: "Kod yazma, refactor, code review, hata ayiklama"
  reasoning:
    description: "Akil yurutme, matematik, cok adimli problem cozme"
  persona:
    description: "Rol yapma, karakter/persona, yaratici diyalog"
  fallback:
    description: "Diger modeller mesgulken hizli, hafif yanit"

