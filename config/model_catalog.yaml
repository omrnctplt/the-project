# Kurallar yukaridan asagi degerlendirilir; ilk eslesen kazanir.
# "@department_primary" tokeni o anki kullanicinin departman varsayilanini ifade eder.
routing_rules:
  - name: "Prompt'ta kod blogu / fonksiyon imzasi varsa coding modeli"
    when:
      prompt_matches: "```|\\bdef \\b|\\bfunction \\b|\\bclass \\b|\\bSELECT \\b|#include|=>|console\\.log"
    then_category: code
    priority: 100

  - name: "Matematik / hesap iceren prompt reasoning'e"
    when:
      prompt_matches: "(?i)hesapla|formul|matematik|integral|turev|denklem|=\\s*\\?"
    then_category: reasoning
    priority: 80

  - name: "Departman primary kategorisi"
    when:
      always: true
    then_category: "@department_primary"
    priority: 10
