departments:
  # resource_class    : light / medium / heavy
  # preferred_size    : small / medium / large (router model boyut tercihi)
  # rate_limit_per_min: dakikada maks istek
  hr:
    label: "Insan Kaynaklari"
    primary_category: text
    allowed_categories: [text, persona, fallback]
    resource_class: light
    preferred_size: small
    rate_limit_per_min: 30

  engineering:
    label: "Muhendislik / Yazilim"
    primary_category: code
    allowed_categories: [code, text, reasoning, fallback]
    resource_class: heavy
    preferred_size: large
    rate_limit_per_min: 60

  legal:
    label: "Hukuk"
    primary_category: text
    allowed_categories: [text, reasoning, fallback]
    resource_class: medium
    preferred_size: medium
    rate_limit_per_min: 20

  finance:
    label: "Finans / Muhasebe"
    primary_category: reasoning
    allowed_categories: [reasoning, text, fallback]
    resource_class: medium
    preferred_size: medium
    rate_limit_per_min: 30

  marketing:
    label: "Pazarlama"
    primary_category: text
    allowed_categories: [text, persona, fallback]
    resource_class: light
    preferred_size: small
    rate_limit_per_min: 30

  general:
    label: "Genel Kullanici"
    primary_category: text
    allowed_categories: [text, persona, reasoning, fallback]
    resource_class: light
    preferred_size: small
    rate_limit_per_min: 15

# Kurallar yukaridan asagi degerlendirilir; ilk eslesen kazanir.
# "@department_primary" tokeni o anki kullanicinin departman varsayilanini ifade eder.
# Admin "Ayarlar > Kategori atamasi" ile bir kategoride hangi modellerin
# kullanilacagini ezebilir (category_assignments); router once o atamaya bakar.
routing_rules:
  - name: "Prompt'ta kod blogu / fonksiyon imzasi varsa coding modeli"
    when:
      prompt_matches: "```|\\bdef \\b|\\bfunction \\b|\\bclass \\b|\\bSELECT \\b|#include|=>|console\\.log"
    then_category: code
    priority: 100

  - name: "Persona / rol yapma istegi"
    when:
      prompt_matches: "(?i)\\brol yap\\b|\\bpersona\\b|karakter ol|gibi davran|\\broleplay\\b|canlandir|rolune gir"
    then_category: persona
    priority: 90

  - name: "Matematik / hesap iceren prompt reasoning'e"
    when:
      prompt_matches: "(?i)hesapla|formul|matematik|integral|turev|denklem|=\\s*\\?"
    then_category: reasoning
    priority: 80

  - name: "Departman primary kategorisi"
    when:
      always: true
    then_category: "@department_primary"
    priority: 10
