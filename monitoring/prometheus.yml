global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: onprem-ai

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:7070']
        labels:
          service: gateway

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
